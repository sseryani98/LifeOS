specVersion: "4.0"
metadata:
  name: com.financialplanner.adminmasterdata
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /admin-master-data/webapp
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
