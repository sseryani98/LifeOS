specVersion: "4.0"
metadata:
  name: com.financialplanner.transactions
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /transactions/webapp
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
