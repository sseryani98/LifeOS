# Runtime Messages — camelCase.dots keys
# Used by MessagingUtility.getText() for backend validation and error messages.
# Key format: domain.action.description = Message text with {0} placeholders

# Common
entity.notFound = The requested {0} was not found
validation.required = {0} is required
validation.amount.required = Amount is required and must be greater than zero
validation.card.invalidState = Card instance is not in a valid state for this operation
sync.completed = Synchronization completed successfully for {0}
import.completed = Import completed: {0} records processed, {1} created, {2} updated

# Admin — Master Data
admin.deleteBlocked = Cannot delete {0} — {1} record(s) reference it
admin.duplicateName = {0} with name "{1}" already exists
admin.readOnly = {0} is read-only and cannot be modified

# Budget Allocation
admin.budget.invalidRatio = Ratio must be between 0 and 100
admin.budget.excludedType = Cannot allocate budget to "{0}" — excluded from budget
admin.budget.historicalReadOnly = Cannot modify a closed budget allocation

# Issuer Application Rule
admin.issuerRule.missingIssuerOrProgram = At least one of Issuer or Rewards Program is required
admin.issuerRule.invalidParameter = {0} must be a positive integer

# CSV Format Config
admin.csvConfig.invalidAmountStyle = Specify either (Amount Column + Amount Sign) or (Debit Column + Credit Column), not both
admin.csvConfig.missingStatusValue = Status Posted Value is required when Status Column is set

# Recurrent Expense
admin.recurrentExpense.overlap = Period overlaps with existing "{0}" ({1} to {2})

# System Config
admin.systemConfig.duplicateKey = System Config key "{0}" already exists

# Deduplication
