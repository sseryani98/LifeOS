specVersion: "4.0"
metadata:
  name: com.lifeos.projecttracker.projectview
type: application
customConfiguration:
  cds-plugin-ui5:
    # Pinned to the resourceRoot the launch page maps this namespace to.
    mountPath: /project-view/webapp
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        # Test-run copy of ui5.yaml: instruments sources for the UI5 coverage gate.
        coverage:
          exclude:
            - "**/test/**"
