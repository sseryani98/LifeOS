specVersion: "4.0"
metadata:
  name: com.lifeos.shared
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /lifeos-shared
resources:
  configuration:
    paths:
      webapp: "app"
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        # Test-run copy of ui5.yaml: instruments sources for the consuming module's UI5 coverage gate.
        # babel-plugin-istanbul skips files outside its cwd, which defaults to the consuming
        # module's folder. A relative cwd breaks its Windows path check once any other option is
        # set, so the exclusions sit in this package's package.json "nyc" key instead.
        coverage:
          cwd: "../Shared"
