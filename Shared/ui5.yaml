specVersion: "4.0"
metadata:
  name: com.lifeos.shared
type: application
customConfiguration:
  cds-plugin-ui5:
    # A module serves this package as an npm dependency; every index.html maps
    # com.lifeos.shared -> ./lifeos-shared/ to match.
    mountPath: /lifeos-shared
resources:
  configuration:
    paths:
      webapp: "app"
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
