<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Planner</title>

  <!-- SAPUI5 Bootstrap — loads sap_horizon from CDN -->
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-resourceroots='{
      "com.financialplanner.shell": "./shell/",
      "com.financialplanner.shared": "./shared/"
    }'
    data-sap-ui-libs="sap.m, sap.tnt, sap.f, sap.ui.layout, sap.uxap"
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
  </script>

  <!-- Theme overrides — loaded after Horizon, wins by cascade order -->
  <link rel="stylesheet" href="shared/css/theme-overrides.css">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { overflow: hidden; }
    #content { height: 100%; }
  </style>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div data-sap-ui-component
    data-name="com.financialplanner.shell"
    data-id="shellContainer"
    data-settings='{ "id": "shell" }'
    style="height: 100%">
  </div>
</body>
</html>
