specVersion: "4.0"
metadata:
  name: com.financialplanner.shared
type: application
customConfiguration:
  cds-plugin-ui5:
    # Served at /shared to match the resourceRoot index.html maps
    # com.financialplanner.shared -> ./shared/ ; keeps index.html unchanged.
    mountPath: /shared
resources:
  configuration:
    # The shared modules sit flat under this folder (no webapp/ subdir).
    paths:
      webapp: "."
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
