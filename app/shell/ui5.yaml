specVersion: "4.0"
metadata:
  name: com.financialplanner.shell
type: application
customConfiguration:
  cds-plugin-ui5:
    # Served at /shell to match the resourceRoot index.html maps
    # com.financialplanner.shell -> ./shell/ ; keeps index.html unchanged.
    mountPath: /shell
resources:
  configuration:
    # The shell has no webapp/ subdir — its sources sit directly under this folder.
    paths:
      webapp: "."
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
